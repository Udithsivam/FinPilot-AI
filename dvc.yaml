stages:
  train:
    cmd: python -m src.pipeline.train
    deps:
      - data/raw/data.csv
      - src/data
      - src/features
      - src/pipeline/preprocessing.py
      - src/pipeline/train.py
      - src/training
      - src/evaluation
    params:
      - params.yaml:
    outs:
      - models/savings_prediction_pipeline.pkl
    metrics:
      - reports/training_metrics.json:
          cache: false

  categorize_train:
    cmd: python -m src.categorization.train
    deps:
      - data/raw/finpilot_transactions.csv
      - src/categorization/features.py
      - src/categorization/taxonomy.py
      - src/categorization/train.py
    outs:
      - models/transaction_categorizer_pipeline.pkl
    metrics:
      - reports/categorization_metrics.json:
          cache: false

  forecast_train:
    cmd: python -m src.forecasting.train
    deps:
      - data/raw/finpilot_transactions.csv
      - src/categorization/taxonomy.py
      - src/forecasting/features.py
      - src/forecasting/train.py
    outs:
      - models/expense_forecast_pipeline.pkl
    metrics:
      - reports/expense_forecast_metrics.json:
          cache: false

  cashflow_train:
    cmd: python -m src.cashflow.train
    deps:
      - data/raw/finpilot_transactions.csv
      - src/categorization/taxonomy.py
      - src/cashflow/features.py
      - src/cashflow/train.py
    outs:
      - models/cashflow_forecast_pipeline.pkl
    metrics:
      - reports/cashflow_forecast_metrics.json:
          cache: false
